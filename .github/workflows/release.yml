name: CapyDock CI and release

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev, release]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and never interrupt an upload. New pending release runs
# include all commits since the last tag, even when GitHub coalesces the queue.
concurrency:
  group: capydock-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Check versions, formatting and frontend types
        run: |
          npm run version:check
          npm run format:check
          cargo fmt --all -- --check
          npm run typecheck
      - name: Test interface, sync engine and release automation
        run: |
          npm run test:ui
          npm run test:release
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compute the release from Conventional Commits
        id: plan
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
        run: npm run release:plan
      - name: Compile dev and pull requests without publishing
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/release'
        run: npm run tauri -- build --no-bundle
      - name: Build only the Linux x86-64 AppImage
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          rm -rf target/release/bundle/appimage
          npm run tauri -- build --bundles appimage
          npm run release:appimage
          npm run release:package
      - name: Retain the exact validated build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capydock-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capydock-${{ github.sha }}
          path: release-dist/
      - name: Advance release, tag and publish AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs
