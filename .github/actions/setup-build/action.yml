name: Set up CapyDock Linux build
description: Install the tools and bundled executables required by the AppImage.
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev libgtk-3-dev \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          patchelf libfuse2 libsecret-1-0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"
        cache: npm
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        # Previous caches included a nested SDK Git checkout under target/.
        shared-key: capydock-linux-x64-v2
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"
    - name: Install locked JavaScript dependencies
      shell: bash
      run: npm ci
    - name: Download pinned Proton CLI and verify SHA-512
      shell: bash
      run: npm run cli:install -- --locked
    - name: Build the Computers helper from its pinned source
      shell: bash
      env:
        # Rust cache cleanup must never touch the SDK's Git metadata or dependencies.
        PROTON_SDK_SOURCE: ${{ runner.temp }}/capydock-computers-sdk
      run: npm run computers:build
